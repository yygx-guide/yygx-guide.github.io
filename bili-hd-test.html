<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>B站高清播放器实验｜烟雨助手</title>
<style>
:root{color-scheme:light;--paper:#f3eddf;--ink:#292b27;--muted:#77786f;--line:rgba(65,70,60,.18);--red:#a94432}
*{box-sizing:border-box}
body{margin:0;padding:28px 16px 48px;background:var(--paper);color:var(--ink);font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
main{max-width:900px;margin:0 auto}
h1{font-family:"Noto Serif SC","Songti SC",serif;font-size:26px;margin:0 0 8px}
p{line-height:1.7}
.muted{color:var(--muted);font-size:14px}
.player-shell{width:100%;aspect-ratio:16/9;background:#151715;border:1px solid #343831;border-radius:8px;overflow:hidden;position:relative}
#nano-player,#fallback-frame{width:100%;height:100%;display:block;border:0}
#fallback-frame{display:none}
.status{margin:12px 0;padding:10px 12px;border:1px solid var(--line);border-radius:6px;font-size:14px;line-height:1.6}
.status.error{border-color:#d6a29a;color:#873d31;background:rgba(169,68,50,.06)}
.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:14px}
a{color:#8e4637}
a.button{display:inline-block;background:#a94432;color:#fff;text-decoration:none;padding:10px 16px;border-radius:5px;font-weight:600}
a.secondary{padding:10px 0}
.card{margin-top:22px;padding:16px;border:1px solid var(--line);border-radius:8px;background:rgba(255,255,255,.35)}
code{overflow-wrap:anywhere}
</style>
</head>
<body>
<main>
  <h1>观星快速入门 · 高清播放器实验</h1>
  <p class="muted">这是独立测试页，不会替换正式使用指南中的播放器。</p>
  <div class="player-shell">
    <div id="nano-player"></div>
    <iframe id="fallback-frame" title="B站备用播放器" allowfullscreen
      referrerpolicy="strict-origin-when-cross-origin"
      allow="autoplay; fullscreen; picture-in-picture; encrypted-media"></iframe>
  </div>
  <div id="status" class="status" role="status">正在加载 B 站 NANO 播放核心……</div>
  <div class="actions">
    <a class="button" href="https://www.bilibili.com/video/BV1Vn1NzPEP4/" target="_blank" rel="noopener noreferrer">前往 B 站观看原画质</a>
    <a class="secondary" href="https://yygx-guide.github.io/intro.html">返回正式使用指南</a>
  </div>
  <section class="card">
    <strong>测试说明</strong>
    <p class="muted">本页在电脑浏览器中尝试使用 BWiki「B站视频 Widget」公开的 NANO 播放核心接口；手机和平板使用 B 站移动端播放器作为兼容回退。NANO 核心是否能提供 720P/1080P，仍取决于 B 站账号登录状态、稿件权限、浏览器及 B 站接口策略。</p>
    <p class="muted">如果出现登录提示，请只在 bilibili.com 官方页面登录，不要向本网站输入密码或验证码。</p>
  </section>
</main>
<script>
(function(){
  var bvid = "BV1Vn1NzPEP4";
  var status = document.getElementById("status");
  var host = document.getElementById("nano-player");
  var fallback = document.getElementById("fallback-frame");
  var ua = navigator.userAgent.toLowerCase();
  var isMobile = /android|adr|iphone|ipad|ipod/.test(ua);

  function showFallback(message) {
    host.style.display = "none";
    fallback.style.display = "block";
    fallback.src = "https://player.bilibili.com/player.html?bvid=" +
      encodeURIComponent(bvid) + "&page=1&autoplay=0&danmaku=0";
    status.className = "status error";
    status.textContent = message +
      " 已切换到标准播放器。";
  }

  if (isMobile) {
    showFallback("移动设备采用 B 站兼容播放器；NANO 桌面核心不适用于此设备。");
    return;
  }

  window.activity = { id: 11610, spmId: "888.211" };
  window.reportMsgObj = {};
  window.reportConfig = {
    sample: 1,
    extMsgs: { appBuvid: (navigator.userAgent.match(/Buvid\/([a-zA-Z0-9]+)/) || [])[1] || "" },
    scrollTracker: true,
    msgObjects: "reportMsgObj",
    pvMsg: {},
    errorTracker: true
  };
  window.SEARCH_PARAM = { autoplay: false, poster: true, muted: false };

  function loadScript(src) {
    return new Promise(function(resolve, reject) {
      var s = document.createElement("script");
      s.src = src;
      s.async = true;
      s.onload = resolve;
      s.onerror = function() { reject(new Error("无法加载 B 站播放器核心脚本")); };
      document.head.appendChild(s);
    });
  }

  function fetchJson(url) {
    // 与 BWiki Widget:Biliplayer 保持一致：普通跨域 fetch，不强制携带第三方 Cookie。
    return fetch(url).then(function(response) {
      if (!response.ok) throw new Error("B站接口 HTTP " + response.status);
      return response.json();
    });
  }

  Promise.resolve()
    .then(function() {
      return loadScript("https://s1.hdslb.com/bfs/seed/jinkela/short/player/player-util.js");
    })
    .then(function() {
      return loadScript("https://s1.hdslb.com/bfs/static/player/main/core.9ba60fbf.js");
    })
    .then(function() {
      if (!window.nano || typeof window.nano.createPlayer !== "function") {
        throw new Error("未检测到 NANO SDK");
      }

      host.style.cssText = "width:100%;height:100%;max-width:100%;";
      var nanoPlayer = window.nano.createPlayer({
        element: host,
        bvid: bvid,
        p: 1,
        autoplay: false,
        muted: false,
        poster: true,
        stats: { bSource: "widget_demo" }
      });

      status.textContent = "NANO 核心已初始化，正在读取 B 站稿件信息……";

      // 复现 BWiki Widget:Biliplayer 的顺序：先获取稿件及 UP 主资料，再 connect。
      return fetchJson("https://api.bilibili.com/x/web-interface/view?bvid=" + encodeURIComponent(bvid))
        .then(function(videoResponse) {
          if (!videoResponse || videoResponse.code !== 0 || !videoResponse.data) {
            throw new Error("B站稿件接口返回：" +
              (videoResponse && videoResponse.message ? videoResponse.message : "无法读取稿件信息"));
          }
          var video = videoResponse.data;
          return fetchJson("https://api.bilibili.com/x/web-interface/card?mid=" +
            encodeURIComponent(video.owner.mid) + "&photo=true")
            .catch(function() { return null; })
            .then(function(ownerResponse) {
              return { video: video, owner: ownerResponse };
            });
        })
        .then(function(metadata) {
          status.textContent = "稿件信息已读取，正在连接 NANO 播放核心……";
          return nanoPlayer.connect().then(function() {
            status.className = "status";
            status.textContent = "NANO 已连接。请点击播放并检查清晰度；B站账号权限仍可能限制最高画质。";
            var vd = metadata.video;
            var up = metadata.owner && metadata.owner.data && metadata.owner.data.card;
            var face = (up && up.face) || (vd.owner && vd.owner.face);
            var name = (up && up.uname) || (vd.owner && vd.owner.name);
            var link = (up && up.mid) || (vd.owner && vd.owner.mid);
            if (face) {
              var observer = new MutationObserver(function() {
                var avatar = host.querySelector('.bpx-player-ending-functions-avatar[data-action="upinfo"] img');
                if (avatar) { avatar.src = face; avatar.alt = name || ""; }
                var anchor = host.querySelector('.bpx-player-ending-functions-avatar[data-action="upinfo"] a');
                if (anchor && link) anchor.href = "https://space.bilibili.com/" + link + "/";
              });
              observer.observe(host, { childList: true, subtree: true });
            }
          });
        });
    })
    .catch(function(error) {
      console.error("[BWiki Biliplayer-compatible test]", error);
      showFallback("NANO 播放失败：" + (error && error.message ? error.message : "未知错误") +
        "。这说明当前浏览器或 B 站接口未能完成高清核心加载。");
    });
})();
</script>
</body>
</html>
